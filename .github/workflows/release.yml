name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Derive release version
      id: version
      run: |
        version_name="${GITHUB_REF_NAME#v}"
        if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tags must be stable semver, like v2.2.0."
          exit 1
        fi
        IFS='.' read -r major minor patch <<< "$version_name"
        version_code=$((major * 10000 + minor * 100 + patch))

        echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
        echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

    # Release notes are written by hand and committed before tagging.
    - name: Check the release notes
      run: |
        notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
        if [ ! -s "$notes" ]; then
          echo "::error::Commit $notes before tagging ${GITHUB_REF_NAME}."
          exit 1
        fi

    # The APK on GitHub and the bundle for Google Play are signed with the same key, so
    # people who installed one can update to the other. Never fall back to the debug key here.
    - name: Prepare release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "::error::RELEASE_KEYSTORE_BASE64 is not set; refusing to publish a release signed with the debug key."
          exit 1
        fi
        echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
        echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

    - name: Build the release APK and bundle
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: >-
        ./gradlew assembleDebug assembleRelease bundleRelease
        -PreleaseVersionName="${{ steps.version.outputs.version_name }}"
        -PreleaseVersionCode="${{ steps.version.outputs.version_code }}"

    - name: Rename the outputs
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk cluster-headache-tracker-debug.apk
        mv app/build/outputs/apk/release/app-release.apk cluster-headache-tracker.apk
        mv app/build/outputs/bundle/release/app-release.aab cluster-headache-tracker.aab

    # The bundle is what goes to Google Play (uploaded by hand in the Play Console).
    - name: Keep the Google Play bundle
      uses: actions/upload-artifact@v4
      with:
        name: cluster-headache-tracker-${{ steps.version.outputs.version_name }}-aab
        path: cluster-headache-tracker.aab

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: packaging/release-notes/${{ github.ref_name }}.md
        generate_release_notes: false
        files: |
          cluster-headache-tracker.apk
          cluster-headache-tracker-debug.apk
