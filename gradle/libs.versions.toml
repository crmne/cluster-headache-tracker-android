[versions]
activity = "1.13.0"
agp = "9.4.1"
appcompat = "1.8.0"
bridgeComponents = "v0.14.0"
constraintlayout = "2.2.2"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
detekt = "1.23.8"
espressoCore = "3.7.0"
glance = "1.2.0"
hotwire = "1.3.1"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.4.20"
kotlinxSerialization = "1.11.0"
ktlint = "1.8.0"
lifecycle = "2.11.0"
material = "1.14.0"
spotless = "8.10.3"
testCore = "1.7.0"
testRunner = "1.7.0"
